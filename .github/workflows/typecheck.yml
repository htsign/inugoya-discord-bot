name: type check

on: [pull_request]

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: setup node
      uses: actions/setup-node@v7
      with:
        node-version: 26
    - run: npm ci
    - run: npm run type-check
