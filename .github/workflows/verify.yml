name: verify

on: [pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: setup node
      uses: actions/setup-node@v7
      with:
        node-version: 26
    - run: npm ci
    - run: npm run verify
